<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Master Html File - IIMB Fest Registration</title>
</head>
<body>
    <header>
        <img src="https://www.iimb.ac.in/sites/default/files/inline-images/IIMB-Logo.png" alt="IIMB Logo" height="40px">
        <h1> IIMB Fest 2026</h1>
    <p>Welcome to the official website of IIMB Fest 2026! We hope you have a great time!</p>

    </header>

    <nav>
        <ul>
            <li><a href="index.html">Click here to go back to Home Page</a></li>
            <li><a href="events.html">Click here to see Events</a></li>
        </ul>
    </nav>
    <main>
    <section>
        <hr/>
        <h2>Register for the fest</h2>
        <form action="/register">
            <label for="name">Enter your Name:</label>
            <input type="text" id="name" name="name" required minlength="2" maxlength="20"><br><br>

            <label for="email">Enter your Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Enter yourPhone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="tshirt">Select T-shirt Size:</label>
            <select id="tshirt" name="tshirt" required>
                <option value="">--Choose--</option>
                <option value="S">Small</option>
                <option value="M">Medium</option>
                <option value="L">Large</option>
                <option value="XL">Extra Large</option>
            </select><br><br>

            <label for="Terms_and Conditions">Accept Terms and Conditions:</label>
            <input type="checkbox" id="terms" name="terms" required><br><br>

            <label for=" Alumni">Are you an Alumni?</label>
            <input type="radio" id="alumni_yes" name="alumni" value ="yes" required> Yes
            <input type="radio" id="alumni_no" name="alumni" value="no" required> No<br><br>

            <input type="submit" value="Register">
        </form>

    </section>

    </main>
</body>
</html>
